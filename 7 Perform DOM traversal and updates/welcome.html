<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef4ff, #f8f5ff);
            font-family: Arial, sans-serif;
        }

        .welcome {
            background: white;
            padding: 50px 80px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #3157a4;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 17px;
        }
    </style>
</head>

<body>

<div class="welcome">
    <h1>Welcome!</h1>
    <p>Your account has been created successfully.</p>
</div>

</body>
</html>
