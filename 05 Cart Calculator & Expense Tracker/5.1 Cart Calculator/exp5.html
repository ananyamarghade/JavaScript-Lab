<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CartEase</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 25px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #172033;
        }

        .container {
            width: 960px;
            max-width: 100%;
            margin: auto;
        }

        .page-heading {
            text-align: center;
            margin-bottom: 38px;
        }

        .page-heading h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #172033;
        }

        .page-heading h1::after {
            content: "";
            display: block;
            width: 42px;
            height: 3px;
            background: #2563eb;
            margin: 11px auto 10px;
        }

        .page-heading p {
            margin: 0;
            font-size: 14px;
            color: #7b8492;
        }

        .input-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding-bottom: 22px;
            border-bottom: 1px solid #d9dee7;
        }

        input {
            height: 44px;
            padding: 0 13px;
            border: 1px solid #cbd3df;
            border-radius: 5px;
            background: #ffffff;
            color: #172033;
            font-size: 14px;
            outline: none;
        }

        input:hover {
            border-color: #aeb8c7;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.08);
        }

        input::placeholder {
            color: #8b95a5;
        }

        #name {
            width: 280px;
        }

        #price,
        #qty {
            width: 125px;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            height: 44px;
            padding: 0 16px;
            border: 0;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s ease;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .generate-btn {
            background: #172033;
            color: white;
        }

        .generate-btn:hover {
            background: #273449;
        }

        .clear-btn {
            background: #ffffff;
            color: #4b5563;
            border: 1px solid #cbd3df;
        }

        .clear-btn:hover {
            background: #f1f5f9;
            border-color: #aeb8c7;
        }

        .table-area {
            margin-top: 30px;
        }

        .table-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 11px;
        }

        .table-title h3 {
            margin: 0;
            font-size: 17px;
            color: #172033;
        }

        .table-title span {
            font-size: 12px;
            color: #8b95a5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
        }

        th {
            padding: 12px 10px;
            background: #f1f4f8;
            border-top: 1px solid #d6dce5;
            border-bottom: 1px solid #d6dce5;
            color: #536071;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            text-align: center;
        }

        td {
            padding: 14px 10px;
            border-bottom: 1px solid #e5e9ef;
            color: #374151;
            font-size: 14px;
            text-align: center;
        }

        tr:hover td {
            background: #fafbfd;
        }

        .result {
            margin-top: 30px;
        }

        .amounts {
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #d6dce5;
            border-bottom: 1px solid #d6dce5;
            padding: 22px 0;
            text-align: center;
        }

        .amount {
            width: 210px;
            min-width: 210px;
            padding: 0 25px;
            margin: 0;
            border-left: 1px solid #e1e5eb;
        }

        .amount:first-child {
            border-left: 0;
        }

        .amount-label {
            display: block;
            margin-bottom: 6px;
            color: #687385;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        .amount-value {
            font-size: 22px;
            font-weight: 700;
            color: #172033;
        }

        .final-value {
            color: #2563eb;
        }

        .result-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            margin-top: 30px;
            padding: 0 30px 25px;
            border-bottom: 1px solid #e1e5eb;
        }

        .result-details > div {
            text-align: center;
        }

        .result-details h3 {
            margin: 0 0 13px;
            font-size: 15px;
            color: #172033;
        }

        .result-details ul {
            margin: 0;
            padding: 0;
            list-style-position: inside;
        }

        .result-details li {
            margin-bottom: 7px;
            color: #596577;
            font-size: 13px;
        }

        .footer-block {
            margin-top: 25px;
            text-align: center;
            font-size: 11px;
            color: #9aa3b1;
            line-height: 1.55;
        }

        .footer-block p {
            margin: 1px 0;
        }

        .footer-block .footer-name {
            color: #374151;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .input-area {
                flex-wrap: wrap;
            }

            #name {
                width: 100%;
            }

            #price,
            #qty {
                flex: 1;
                width: auto;
            }

            .button-group {
                width: 100%;
            }

            .button-group button {
                flex: 1;
            }
        }

        @media (max-width: 650px) {
            body {
                padding: 35px 18px;
            }

            .amounts {
                justify-content: space-between;
            }

            .amount {
                min-width: 0;
                width: auto;
                flex: 1;
                padding: 0 12px;
            }

            .result-details {
                gap: 30px;
            }

            .table-area {
                overflow-x: auto;
            }

            table {
                min-width: 650px;
            }
        }

        @media (max-width: 500px) {
            .page-heading h1 {
                font-size: 32px;
            }

            .amounts {
                display: block;
            }

            .amount {
                width: 100%;
                border-left: 0;
                border-bottom: 1px solid #e5e9ef;
                padding: 13px 0;
            }

            .amount:last-child {
                border-bottom: 0;
            }

            .result-details {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="page-heading">
        <h1>CartEase</h1>
        <p>Shopping Cart & Bill Calculator</p>
    </div>

    <div class="input-area">

        <input
            type="text"
            id="name"
            placeholder="Product Name"
            autocomplete="off"
        >

        <input
            type="number"
            id="price"
            placeholder="Price"
            autocomplete="off"
        >

        <input
            type="number"
            id="qty"
            placeholder="Quantity"
            autocomplete="off"
        >

        <div class="button-group">
            <button class="add-btn" onclick="addProduct()">Add Product</button>
            <button class="generate-btn" onclick="generateBill()">Generate Bill</button>
            <button class="clear-btn" onclick="clearCart()">Clear</button>
        </div>

    </div>

    <div class="table-area">

        <div class="table-title">
            <h3>Cart Items</h3>
            <span>Shopping List</span>
        </div>

        <table id="cartTable">
            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>
        </table>

    </div>

    <div class="result">

        <div class="amounts">

            <div class="amount">
                <span class="amount-label">Total Amount</span>
                <span class="amount-value" id="totalAmount">₹0.00</span>
            </div>

            <div class="amount">
                <span class="amount-label">Discount</span>
                <span class="amount-value" id="discountAmount">₹0.00</span>
            </div>

            <div class="amount">
                <span class="amount-label">Final Amount</span>
                <span class="amount-value final-value" id="finalAmount">₹0.00</span>
            </div>

        </div>

        <div class="result-details">

            <div>
                <h3>Item Summary</h3>
                <ul id="summary"></ul>
            </div>

            <div>
                <h3>Expensive Products (Price &gt; 1000)</h3>
                <ul id="expensive"></ul>
            </div>

        </div>

    </div>

    <div class="footer-block">
        <p>Designed By</p>
        <p class="footer-name">Ananya Marghade</p>
        <p>PRN 24070521004</p>
        <p>Batch A1</p>
    </div>

</div>

<script>

let cart = [];

function addProduct() {

    let name = document.getElementById("name").value;
    let price = parseFloat(document.getElementById("price").value);
    let qty = parseInt(document.getElementById("qty").value);

    if (name == "" || isNaN(price) || isNaN(qty)) {
        alert("Please enter all fields");
        return;
    }

    if (price <= 0 || qty <= 0) {
        alert("Price and quantity must be greater than 0");
        return;
    }

    let product = {
        id: cart.length + 1,
        name: name,
        price: price,
        quantity: qty
    };

    cart.push(product);

    displayCart();

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("qty").value = "";

    document.getElementById("name").focus();
}

function displayCart() {

    let table = document.getElementById("cartTable");

    table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>
    `;

    cart.forEach(function(item) {

        table.innerHTML += `
            <tr>
                <td>${item.id}</td>
                <td>${item.name}</td>
                <td>₹${item.price.toFixed(2)}</td>
                <td>${item.quantity}</td>
                <td>₹${(item.price * item.quantity).toFixed(2)}</td>
            </tr>
        `;

    });

    calculateBill();
}

function calculateBill() {

    let total = cart.reduce(function(sum, item) {
        return sum + (item.price * item.quantity);
    }, 0);

    let discount = 0;

    if (total >= 50000) {
        discount = total * 0.20;
    }
    else if (total >= 20000) {
        discount = total * 0.10;
    }
    else if (total >= 5000) {
        discount = total * 0.05;
    }

    let finalAmount = total - discount;

    document.getElementById("totalAmount").innerText =
        "₹" + total.toFixed(2);

    document.getElementById("discountAmount").innerText =
        "₹" + discount.toFixed(2);

    document.getElementById("finalAmount").innerText =
        "₹" + finalAmount.toFixed(2);

    let summary = document.getElementById("summary");

    summary.innerHTML = "";

    cart.forEach(function(item) {

        summary.innerHTML +=
            `<li>${item.name} : ₹${(item.price * item.quantity).toFixed(2)}</li>`;

    });

    let expensive = document.getElementById("expensive");

    expensive.innerHTML = "";

    let exp = cart.filter(function(item) {
        return item.price > 1000;
    });

    exp.forEach(function(item) {

        expensive.innerHTML +=
            `<li>${item.name}</li>`;

    });
}

function generateBill() {

    if (cart.length == 0) {
        alert("Please add at least one product.");
        return;
    }

    let total = cart.reduce(function(sum, item) {
        return sum + (item.price * item.quantity);
    }, 0);

    let discount = 0;

    if (total >= 50000) {
        discount = total * 0.20;
    }
    else if (total >= 20000) {
        discount = total * 0.10;
    }
    else if (total >= 5000) {
        discount = total * 0.05;
    }

    let finalAmount = total - discount;

    alert(
        "Bill generated successfully!\n\n" +
        "Total Amount: ₹" + total.toFixed(2) + "\n" +
        "Discount: ₹" + discount.toFixed(2) + "\n" +
        "Final Amount: ₹" + finalAmount.toFixed(2)
    );
}

function clearCart() {

    cart = [];

    document.getElementById("cartTable").innerHTML = `
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>
    `;

    document.getElementById("totalAmount").innerText = "₹0.00";
    document.getElementById("discountAmount").innerText = "₹0.00";
    document.getElementById("finalAmount").innerText = "₹0.00";

    document.getElementById("summary").innerHTML = "";
    document.getElementById("expensive").innerHTML = "";

    alert("Cart cleared successfully.");
}

</script>

</body>
</html>
