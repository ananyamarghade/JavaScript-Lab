<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Registration Validator</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI, Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#eaf2ff,#cfe2ff,#aecbff);
        }

        .container{
            width:420px;
            background:#ffffff;
            padding:35px;
            border-radius:18px;
            text-align:center;
            box-shadow:
            0 12px 30px rgba(0,0,0,0.10),
            0 20px 45px rgba(37,99,235,0.15);
        }

        h2{
            color:#1e3a8a;
            margin-bottom:10px;
            font-size:30px;
        }

        .info{
            color:#666;
            font-size:15px;
            margin-bottom:25px;
            padding-bottom:15px;
            border-bottom:1px solid #e5e7eb;
        }

        label{
            display:block;
            text-align:left;
            font-weight:bold;
            margin-bottom:8px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            font-size:17px;
            border:2px solid #d1d5db;
            border-radius:10px;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            border-color:#2563eb;
            box-shadow:0 0 8px rgba(37,99,235,0.25);
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            font-size:17px;
            font-weight:bold;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
            background:linear-gradient(to right,#2563eb,#4f46e5);
            transition:.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 18px rgba(37,99,235,.30);
        }

        #result{
            min-height:58px;
            margin-top:22px;
            padding:15px;
            border-radius:10px;
            display:none;
            justify-content:center;
            align-items:center;
            font-size:17px;
            font-weight:bold;
        }

        .success{
            display:flex !important;
            background:#dcfce7;
            border:2px solid #22c55e;
            color:#166534;
        }

        .error{
            display:flex !important;
            background:#fee2e2;
            border:2px solid #ef4444;
            color:#991b1b;
        }

        .example{
            margin-top:18px;
            font-size:14px;
            color:#666;
        }

        .example span{
            color:#2563eb;
            font-weight:bold;
        }
        .footer-block {
            margin-top: 28px;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            line-height: 1.4;
            }

        .footer-block p {
            margin: 0;
            }

    </style>

    <script src="vehicleregistration.js"></script>

</head>

<body>

<div class="container">

    <h2>Vehicle Registration Validator</h2>

    <p class="info">
        Validate an Indian Vehicle Registration Number
    </p>

    <label>Registration Number</label>

    <input
        type="text"
        id="text"
        placeholder="Example: MH12AB1234"
        maxlength="10">

    <button onclick="checkRegistrationNumber()">
        Validate
    </button>

    <div id="result"></div>


</div>
<div class="footer-block">
    <p>Designed By</p>
    <p class="footer-name">Ananya Marghade</p>
    <p>PRN 24070521004</p>
    <p>Batch A1</p>
</div>
</body>
</html>
