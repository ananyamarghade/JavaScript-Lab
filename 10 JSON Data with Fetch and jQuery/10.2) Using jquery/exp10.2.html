<!DOCTYPE html>
<html>
<head>
    <title>Student Details using JSON and jQuery</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px;
            font-family: Arial, sans-serif;
            background: #edf3ef;
            color: #293b33;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 35px;
            background: #ffffff;
            border: 1px solid #d7e4dc;
            border-radius: 4px;
            box-shadow: 0 8px 25px rgba(42, 73, 54, 0.06);
        }

        .header {
            padding: 8px 0 24px;
            border-bottom: 2px solid #dce9e0;
        }

        h2 {
            margin: 0 0 10px;
            color: #245844;
            font-size: 27px;
        }

        .subtitle {
            margin: 0;
            color: #73877b;
            font-size: 14px;
            line-height: 1.6;
        }

        .section {
            padding: 25px 0 10px;
        }

        h3 {
            margin: 0 0 8px;
            color: #354b3e;
            font-size: 19px;
        }

        .description {
            margin: 0 0 20px;
            color: #78877d;
            font-size: 14px;
            line-height: 1.6;
        }

        button {
            padding: 12px 23px;
            border: none;
            border-radius: 4px;
            background: #32775a;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #245640;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 14px 15px;
            border-bottom: 1px solid #e2ebe4;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #315d49;
            color: #ffffff;
            font-weight: 600;
            border: none;
        }

        td {
            color: #43564a;
        }

        tbody tr:nth-child(even) {
            background: #f2f7f3;
        }

        tbody tr:hover {
            background: #e3f0e7;
        }

        footer {
            margin-top: 30px;
            padding: 20px 10px 5px;
            border-top: 1px solid #dce9e0;
            text-align: center;
            color: #7b8b80;
            font-size: 13px;
            line-height: 1.8;
        }

        footer strong {
            display: block;
            color: #245844;
            font-size: 15px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 22px 16px;
            }

            h2 {
                font-size: 23px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>Student Details using JSON & jQuery</h2>
            <p class="subtitle">
                Retrieve and display student records from a JSON file using jQuery.
            </p>
        </div>

        <div class="section">
            <h3>Student Records</h3>

            <button id="loadBtn">Load Students</button>
        </div>

        <div class="table-wrapper">
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Marks</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        $("#loadBtn").click(function() {
            $.getJSON("students1.json", function(data) {
                $("#tableBody").empty();

                $.each(data, function(index, student) {
                    $("#tableBody").append(`
                        <tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.department}</td>
                            <td>${student.marks}</td>
                        </tr>
                    `);
                });
            }).fail(function() {
                alert("Error loading JSON data");
            });
        });
    </script>

    <footer>
        Designed By
        <strong>Ananya Marghade</strong>
        <span>PRN 24070521004</span><br>
        <span> Batch A1 </span>
    </footer>
</body>
</html>
