<!DOCTYPE html>
<html>
<head>
    <title>Gym Admission Form</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');

        *{
            box-sizing:border-box;
        }

        body{
            font-family:'Inter', Arial, sans-serif;
            background:#f4f2ee;
            min-height:100vh;
            margin:0;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:40px 20px;
        }

        .container{
            width:100%;
            max-width:520px;
            background:#ffffff;
            border:1px solid #e4e0d8;
            border-radius:6px;
            box-shadow:0 12px 40px rgba(30,25,15,0.08);
            overflow:hidden;
        }

        .banner{
            background:#1f4d3a;
            padding:26px 32px;
        }

        .banner .eyebrow{
            font-size:12px;
            font-weight:600;
            color:#8fbfa5;
            margin:0 0 6px;
        }

        .banner h2{
            font-family:'Space Grotesk', sans-serif;
            font-size:24px;
            font-weight:700;
            color:#ffffff;
            margin:0 0 4px;
            letter-spacing:-0.02em;
        }

        .banner .subtitle{
            color:#bcd6c8;
            font-size:14px;
            margin:0;
        }

        form{
            padding:28px 32px 32px;
        }

        .field-row{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:0 16px;
        }

        label{
            display:block;
            margin-top:16px;
            font-size:13px;
            font-weight:500;
            color:#57534a;
        }

        input, select{
            width:100%;
            padding:10px 12px;
            margin-top:6px;
            font-family:'Inter', Arial, sans-serif;
            font-size:14px;
            color:#28251f;
            background:#fbfaf8;
            border:1px solid #d8d3c8;
            border-radius:4px;
            outline:none;
            transition:border-color 0.15s ease;
        }

        input::placeholder{
            color:#a8a296;
        }

        input:focus, select:focus{
            border-color:#1f4d3a;
        }

        select{
            appearance:none;
            background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2357534a'/></svg>");
            background-repeat:no-repeat;
            background-position:right 12px center;
        }

        .error{
            display:block;
            color:#c0392b;
            font-size:12px;
            margin-top:5px;
            min-height:14px;
        }

        .success{
            color:#1f4d3a;
            font-size:14px;
            text-align:center;
            font-weight:600;
            margin-top:16px;
            margin-bottom:0;
        }

        button{
            width:100%;
            padding:13px;
            margin-top:24px;
            font-family:'Space Grotesk', sans-serif;
            font-size:15px;
            font-weight:700;
            background:#1f4d3a;
            color:#ffffff;
            border:none;
            border-radius:4px;
            cursor:pointer;
            transition:background 0.15s ease;
        }

        button:hover{
            background:#296449;
        }

        button:active{
            background:#173a2b;
        }

        .footer{
            max-width:520px;
            margin:18px auto 0;
            text-align:center;
        }

        .footer-label{
            font-size:11px;
            color:#a39d8f;
            margin:0;
        }

        .footer-name{
            font-size:13px;
            font-weight:600;
            color:#57534a;
            margin:2px 0 0;
        }

        .footer-meta{
            font-size:12px;
            color:#a39d8f;
            margin:2px 0 0;
        }

        @media (max-width:480px){
            .field-row{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="banner">
        <p class="eyebrow">Membership Registration</p>
        <h2>Gym Admission Form</h2>
        <p class="subtitle">Your journey to Fitness starts here!</p>
    </div>

    <form id="gymForm">

        <label>Full Name</label>
        <input type="text" id="name">
        <span id="nameError" class="error"></span>

        <div class="field-row">
            <div>
                <label>Age</label>
                <input type="number" id="age">
                <span id="ageError" class="error"></span>
            </div>
            <div>
                <label>Mobile Number</label>
                <input type="text" id="mobile">
                <span id="mobileError" class="error"></span>
            </div>
        </div>

        <label>Email</label>
        <input type="email" id="email">
        <span id="emailError" class="error"></span>

        <label>Membership Plan</label>
        <select id="plan">
            <option value="">Select Plan</option>
            <option>Monthly</option>
            <option>Quarterly</option>
            <option>Yearly</option>
        </select>
        <span id="planError" class="error"></span>

        <button type="submit">Submit</button>

        <p id="result" class="success"></p>

    </form>
</div>

<div class="footer">
    <p class="footer-label">Designed By</p>
    <p class="footer-name">Ananya Marghade</p>
    <p class="footer-meta">PRN 24070521004</p>
    <p class="footer-meta">Batch A1</p>
</div>

<script>

document.getElementById("name").addEventListener("blur", function(){
    let name=this.value;
    if(/^[A-Za-z ]+$/.test(name)){
        document.getElementById("nameError").innerHTML="";
    }else{
        document.getElementById("nameError").innerHTML="Only letters allowed.";
    }
});

document.getElementById("name").addEventListener("focus", function(){
    document.getElementById("nameError").innerHTML="";
});

document.getElementById("age").addEventListener("blur", function(){
    let age=this.value;
    if(age>=16 && age<=60){
        document.getElementById("ageError").innerHTML="";
    }else{
        document.getElementById("ageError").innerHTML="Age must be between 16 and 60.";
    }
});

document.getElementById("age").addEventListener("focus", function(){
    document.getElementById("ageError").innerHTML="";
});

document.getElementById("email").addEventListener("blur", function(){
    let email=this.value;
    let pattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(pattern.test(email)){
        document.getElementById("emailError").innerHTML="";
    }else{
        document.getElementById("emailError").innerHTML="Invalid email.";
    }
});

document.getElementById("email").addEventListener("focus", function(){
    document.getElementById("emailError").innerHTML="";
});

document.getElementById("mobile").addEventListener("blur", function(){
    let mobile=this.value;

    if(/^\d{10}$/.test(mobile)){
        document.getElementById("mobileError").innerHTML="";
    }else{
        document.getElementById("mobileError").innerHTML="Enter 10-digit mobile number.";
    }
});

document.getElementById("mobile").addEventListener("focus", function(){
    document.getElementById("mobileError").innerHTML="";
});

document.getElementById("plan").addEventListener("change", function(){
    if(this.value==""){
        document.getElementById("planError").innerHTML="Please select a plan.";
    }else{
        document.getElementById("planError").innerHTML="";
    }
});

document.getElementById("gymForm").addEventListener("submit", function(e){

    e.preventDefault();

    if(
        document.getElementById("nameError").innerHTML=="" &&
        document.getElementById("ageError").innerHTML=="" &&
        document.getElementById("emailError").innerHTML=="" &&
        document.getElementById("mobileError").innerHTML=="" &&
        document.getElementById("plan").value!=""
    ){
        document.getElementById("result").innerHTML="Gym Admission Successful!";
    }
    else{
        document.getElementById("result").innerHTML="";
        alert("Please correct the errors before submitting.");
    }
});

</script>

</body>
</html>
