<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="JavaScript Lab — Ananya Marghade" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0c4a6e;#0f172a" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#0c4a6e;#312e81;#1e293b" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7df1e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="60" y="60" height="70" width="0">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.25;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="240" rx="14" fill="url(#bg)"/>

  <!-- floating code symbols -->
  <g font-family="'Courier New', monospace" font-weight="bold" fill="#f7df1e" opacity="0.18">
    <text x="720" y="70" font-size="34">{ }
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="790" y="170" font-size="30" fill="#38bdf8">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="640" y="200" font-size="26" fill="#a78bfa">$()
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4.5s" repeatCount="indefinite"/>
    </text>
    <text x="830" y="60" font-size="22" fill="#38bdf8">=&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="560" y="55" font-size="22">[ ]
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="5.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- typed title -->
  <g clip-path="url(#typeClip)">
    <text x="60" y="115" font-family="'Courier New', monospace" font-size="62" font-weight="bold" fill="url(#accent)" textLength="560" lengthAdjust="spacingAndGlyphs">JavaScript Lab</text>
  </g>

  <!-- blinking cursor -->
  <rect x="60" y="64" width="6" height="60" fill="#f7df1e">
    <animate attributeName="x" values="60;625;625;60" keyTimes="0;0.25;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- accent line -->
  <rect x="60" y="140" height="3" rx="1.5" fill="url(#accent)" width="0">
    <animate attributeName="width" values="0;200;200;0" keyTimes="0;0.3;0.9;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- cycling topics -->
  <g font-family="'Courier New', monospace" font-size="22" fill="#e2e8f0">
    <text x="60" y="180" opacity="0">&gt; Functions, Closures &amp; try-catch
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="180" opacity="0">&gt; DOM Traversal &amp; Event Handling
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.32;0.47;0.52;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="180" opacity="0">&gt; localStorage &amp; sessionStorage
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.57;0.72;0.77;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="180" opacity="0">&gt; JSON with fetch() &amp; jQuery
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.77;0.82;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Ananya Marghade · PRN 24070521004 · Symbiosis Institute of Technology, Nagpur</text>
</svg>
